name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mbx clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mbx test --workspace --locked

  release:
    needs: [fmt, clippy, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Check the tag against Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the tarball
        id: tarball
        run: |
          name="opto-${{ steps.version.outputs.version }}-x86_64"
          make install-files DESTDIR="$PWD/$name" PREFIX=/usr UNITDIR=/usr/lib/systemd/user
          tar --owner=0 --group=0 --numeric-owner -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        run: |
          pacman -S --noconfirm --needed github-cli
          gh release create "$GITHUB_REF_NAME" \
            --title "opto ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "${{ steps.tarball.outputs.name }}.tar.gz" \
            "${{ steps.tarball.outputs.name }}.tar.gz.sha256"

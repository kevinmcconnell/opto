[workspace]
resolver = "3"
members = ["crates/opto-core", "crates/opto-collect", "crates/opto", "crates/omarchy-theme"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
opto-core = { path = "crates/opto-core" }
omarchy-theme = { path = "crates/omarchy-theme" }
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
